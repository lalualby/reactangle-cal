<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Persegi Panjang - Tugas 1</title>
    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a 70%);
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #818cf8;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 48px 12px 16px;
            font-size: 1rem;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.65);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="number"]:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(15, 23, 42, 0.9);
        }

        input[type="number"]::placeholder {
            color: #475569;
        }

        /* Sembunyikan panah default input number agar bersih */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .unit {
            position: absolute;
            right: 14px;
            color: #64748b;
            font-size: 0.875rem;
            font-weight: 500;
            pointer-events: none;
        }

        .btn-calculate {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2);
            transition: all 0.2s ease;
        }

        .btn-calculate:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
            filter: brightness(1.05);
        }

        .btn-calculate:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .result-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .result-card:hover {
            border-color: rgba(99, 102, 241, 0.35);
            background: rgba(15, 23, 42, 0.7);
        }

        .result-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 1.35rem;
            font-weight: 700;
            color: #38bdf8;
            word-break: break-all;
        }

        .result-value.keliling {
            color: #a78bfa;
        }

        .result-unit {
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            margin-left: 2px;
        }

        .formula {
            font-size: 0.72rem;
            color: #64748b;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="badge">JavaScript Pertemuan 1</span>
            <h1>Luas & Keliling Persegi Panjang</h1>
            <p>Masukkan panjang dan lebar untuk menghitung</p>
        </div>

        <!-- Input Panjang -->
        <div class="form-group">
            <label for="panjang">Panjang</label>
            <div class="input-wrapper">
                <input type="number" id="panjang" placeholder="Contoh: 10" value="0">
                <span class="unit">m</span>
            </div>
        </div>

        <!-- Input Lebar -->
        <div class="form-group">
            <label for="lebar">Lebar</label>
            <div class="input-wrapper">
                <input type="number" id="lebar" placeholder="Contoh: 5" value="0">
                <span class="unit">m</span>
            </div>
        </div>

        <!-- Tombol Hitung -->
        <button id="btnHitung" class="btn-calculate" onclick="hitungPersegiPanjang()">Hitung Hasil</button>

        <!-- Hasil Perhitungan -->
        <div class="results">
            <!-- Kartu Luas -->
            <div class="result-card">
                <div class="result-title">Luas</div>
                <div class="result-value">
                    <span id="luas">50</span><span class="result-unit">m<sup>2</sup></span>
                </div>
                <div class="formula">p × l</div>
            </div>

            <!-- Kartu Keliling -->
            <div class="result-card">
                <div class="result-title">Keliling</div>
                <div class="result-value keliling">
                    <span id="keliling">30</span><span class="result-unit">m</span>
                </div>
                <div class="formula">2 × (p + l)</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Fungsi untuk menghitung Luas dan Keliling Persegi Panjang
         */
        function hitungPersegiPanjang() {
            /*
                == Task 1 ==
                Mengambil nilai input panjang dan lebar, lalu diubah ke tipe data number (parseFloat)
            */
            let length = parseFloat(document.getElementById("panjang").value);
            let width = parseFloat(document.getElementById("lebar").value);

            // Validasi jika input kosong atau bukan angka yang valid
            if (isNaN(length) || isNaN(width) || length < 0 || width < 0) {
                document.getElementById("luas").innerText = "-";
                document.getElementById("keliling").innerText = "-";
                return;
            }

            /*
                == Task 2 ==
                Variabel luas berisi hasil perkalian panjang dan lebar (p * l)
            */
            let luas = length * width;

            /*
                == Task 3 ==
                Variabel keliling berisi hasil 2 * (panjang + lebar)
            */
            let keliling = 2 * (length + width);

            /*
                Menampilkan hasil ke elemen HTML
            */
            document.getElementById("luas").innerText = luas;
            document.getElementById("keliling").innerText = keliling;
        }

        // Hitung otomatis saat nilai input berubah (Real-time calculation)
        document.getElementById("panjang").addEventListener("input", hitungPersegiPanjang);
        document.getElementById("lebar").addEventListener("input", hitungPersegiPanjang);

        // Jalankan perhitungan awal saat halaman pertama kali dimuat
        hitungPersegiPanjang();
    </script>
</body>
</html>
